<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin login | Copperline Loans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <header class="top"><span class="brand">Copperline Admin</span></header>
  <main class="wrap">
    <h1 class="login-title">Admin login</h1>
    <form id="loginForm" class="card" novalidate>
      <label class="field" for="username"><span>Username</span>
        <input id="username" type="text" autocomplete="username" required></label>
      <label class="field" for="password"><span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required></label>
      <small id="loginErr" class="error" role="alert"></small>
      <button type="submit" class="btn">Log in</button>
    </form>
  </main>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/login.js"></script>
</body>
</html>
